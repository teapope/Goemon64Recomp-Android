plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.goemon64recomp.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.goemon64recomp.android"
        minSdk 24  // Android 7.0+
        targetSdk 34
        versionCode 1
        versionName "0.1.0-android"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            // Target ABIs
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                // CMake build arguments
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-24",
                          "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++20 -frtti -fexceptions"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // You'll need to configure signing for release builds
            // signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')  // Point to main CMakeLists.txt
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    ndkVersion "26.1.10909125"  // Update to match your installed NDK version
    
    // Optional: Explicitly set NDK path if needed
    // ndkPath "/path/to/your/Android/sdk/ndk/26.1.10909125"
    
    packagingOptions {
        // Exclude duplicate library files
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // File picker for ROM selection
    implementation 'androidx.documentfile:documentfile:1.0.1'
    
    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to copy shared libraries to assets
tasks.register('copyNativeLibs', Copy) {
    from fileTree(dir: 'build/intermediates/cmake/debug/obj', include: '**/*.so')
    into 'src/main/assets/lib'
}

// Make copyNativeLibs run before package assembly
tasks.whenTaskAdded { task ->
    if (task.name.contains('package')) {
        task.dependsOn 'copyNativeLibs'
    }
}

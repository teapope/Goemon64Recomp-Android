
plugins { id 'com.android.application' }

android {
    namespace 'com.teapope.goemon'
    compileSdk 34
    defaultConfig {
        applicationId 'com.teapope.goemon'
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_static" }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    // SDL Java activity comes from the SDL submodule packaged via source; no external AAR here.
}

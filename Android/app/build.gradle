plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goemon.recomp'
    compileSdk 34
    ndkVersion "26.1.10909125"  // Or your NDK version

    defaultConfig {
        applicationId "com.goemon.recomp"
        minSdk 24  // Android 7.0+
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_PLATFORM=android-24",
                          "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++20"
                cFlags "-std=c17"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')  // Point to root CMakeLists.txt
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        // Prevent multiple library versions
        pickFirst 'lib/*/libc++_shared.so'
    }

    sourceSets {
        main {
            // Include SDL sources if using SDL as submodule
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}